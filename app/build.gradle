apply plugin: 'com.android.application'
apply plugin: 'kotlin-parcelize'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.google.gms.google-services'

android {
    namespace 'com.apitap.app'
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.apitap.app"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 5
        versionName "1.0.4"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField("String", "GOOGLE_MAP_KEY", GOOGLE_MAP_KEY)
    }

    buildFeatures {
        buildConfig = true
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false   // change to true later if needed
            shrinkResources false // optional (true when minifyEnabled true)
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            buildConfigField("String", "GOOGLE_MAP_KEY", GOOGLE_MAP_KEY)
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    signingConfigs {
        release {
            storeFile file("/media/shami/Projects1/Android/APITAP-Android/APITAP-Android/release/apitap_app.jks")   // 🔁 path to your keystore
            storePassword "apitapapp"
            keyAlias "apitap app"
            keyPassword "apitapapp"
        }
    }
}

dependencies {
    implementation 'com.google.android.libraries.places:places:5.1.1'
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'com.github.gcacace:signature-pad:1.3.1'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.daimajia.slider:library:1.1.5@aar'
    implementation 'com.hannesdorfmann.smoothprogressbar:library:1.0.0'
    implementation 'com.makeramen:roundedimageview:2.3.0'
    implementation 'com.google.code.gson:gson:2.13.1'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation('com.squareup.retrofit2:converter-gson:2.11.0') {
        exclude group: 'com.google.code.gson', module: 'gson'
    }

    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.1'
    implementation "com.github.bumptech.glide:okhttp3-integration:4.16.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"


    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'com.google.android.gms:play-services-maps:20.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.android.gms:play-services-nearby:19.3.0'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'

    implementation 'com.google.firebase:firebase-core:21.1.1'
    implementation 'com.google.firebase:firebase-messaging:24.1.2'

    implementation 'com.google.android.exoplayer:exoplayer-core:2.14.0'
    implementation 'com.google.android.exoplayer:exoplayer-smoothstreaming:2.14.0'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.14.0'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.14.0'
    implementation 'com.google.android.exoplayer:exoplayer-dash:2.14.0'

    implementation 'com.github.paolorotolo:expandableheightlistview:1.1.0'
    implementation 'com.github.frankiesardo:linearlistview:1.0.1@aar'
    implementation 'com.github.rahatarmanahmed:circularprogressview:2.5.0'
    implementation 'me.relex:circleindicator:2.1.6'

    implementation 'com.daimajia.swipelayout:library:1.2.0@aar'
    implementation 'com.jsibbold:zoomage:1.3.1'

    implementation project(path: ':code-scanner-master')
    implementation project(':aviloader')
    implementation project(':mediapicker')

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.core:core:1.16.0'

    implementation 'com.lsjwzh:materialloadingprogressbar:0.5.8-RELEASE'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    implementation('net.protyposis.android.mediaplayer:mediaplayer:4.5.0') {
        exclude group: 'androidx.appcompat', module: 'appcompat'
        exclude group: 'androidx.core', module: 'core'
        exclude group: 'androidx.core', module: 'core-ktx'
    }

    implementation('net.protyposis.android.mediaplayer:mediaplayer-dash:4.5.0') {
        exclude group: 'androidx.appcompat', module: 'appcompat'
        exclude group: 'androidx.core', module: 'core'
        exclude group: 'androidx.core', module: 'core-ktx'
    }

    implementation files('libs/commons-lang-2.6.jar')

    implementation 'com.github.sharish:ShimmerRecyclerView:v1.3'
    implementation 'com.intuit.sdp:sdp-android:1.1.1'
    implementation 'com.intuit.ssp:ssp-android:1.1.1'

    implementation 'com.github.delight-im:Android-AdvancedWebView:v3.2.1'
    implementation 'com.mikhaellopez:circularprogressbar:3.1.0'
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.29'

    implementation('com.applandeo:material-calendar-view:1.9.2') {
        exclude group: 'androidx.appcompat', module: 'appcompat'
    }

    implementation 'androidx.multidex:multidex:2.0.1'

    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.8.0'
            force 'androidx.core:core-ktx:1.8.0'
            force 'androidx.annotation:annotation-experimental:1.2.0'
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}